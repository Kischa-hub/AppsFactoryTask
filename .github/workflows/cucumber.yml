name: Cucumber Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: read

jobs:
  test:
    name: Chrome (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      CI: "true"

    steps:
      - name: Get project code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run Cucumber tests
        run: npm test

      - name: Upload Cucumber reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-reports-${{ matrix.os }}
          path: reports/
          retention-days: 7
